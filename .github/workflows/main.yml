name: Data Scraping

on:
  schedule:
    # 每天北京时间 20:00（UTC 12:00）；实际启动可能略有延迟。
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-search-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    # 手动运行时也只允许向默认分支写入数据。
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests pandas

      - name: Run scraping script
        run: python microblog_hotsearch_spiders.py

      - name: Commit changes
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Hot_search.csv
          if git diff --cached --quiet; then
            echo "No new hot-search data to commit."
            exit 0
          fi
          git commit -m "Update hot-search data"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
